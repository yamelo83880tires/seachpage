      .box {

      .header {

        border: 2px solid #4285f4;
        padding: 8px;
        border-radius: 5px;
        margin: 10px 0;
        width: 100%;
        text-align: center;
        box-sizing: border-box;
      }

      .btn {
        width: 100%;
        padding: 8px;
        margin: 10px 0;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        color: white;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .btn svg {
        margin-right: 8px;
        width: 18px;
        height: 18px;
      }

      .btn:active {
        transform: scale(0.98);
      }

      .green {
        background: #34a853;
      }
      .green:hover {
        background: #2d7a48;
      }

      .blue {
        background: #4285f4;
      }
      .blue:hover {
        background: #3b77db;
      }

      .red {
        background: #ea4335;
      }
      .red:hover {
        background: #d33426;
      }
      .note {
        font-size: 18px;
        color: #000000;
        margin: 5px 0;
      }
      .note2 {
        font-size: 20px;
        color: #000000;
        margin: 5px 0;
      }
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #34a853;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        display: none;
      }
      .show {
        display: block;
      }

      .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: #666;
      }

      .security-info {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 15px;
        gap: 15px;
      }

      .security-item {
        display: flex;
        align-items: center;
        font-size: 12px;
        color: #666;
      }

      .security-item svg {
        margin-right: 4px;
        color: #34a853;

    <script>
      // Get elements'

      const keyword = document.getElementById("keyword");
      const copyBtn = document.getElementById("copy");
      const searchBtn = document.getElementById("search");
      const luckyBtn = document.getElementById("lucky");
      const toast = document.getElementById("toast");

      // Copy button
      copyBtn.addEventListener("click", function () {
        // Try to copy text
        navigator.clipboard.writeText(keyword.textContent).catch(function () {
          // Fallback if clipboard API fails
          const temp = document.createElement("textarea");
          temp.value = keyword.textContent;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand("copy");
          document.body.removeChild(temp);
        });

        // Show toast
        toast.classList.add("show");
        setTimeout(function () {
          toast.classList.remove("show");
        }, 2000);
      });

      // Search button
      searchBtn.addEventListener("click", function () {
        // Direct method with noreferrer
        const newWindow = window.open('', '_blank');
        if (newWindow) {
          newWindow.opener = null;
          newWindow.location = 'https://www.google.com';
        }
      });

      // Lucky button
      luckyBtn.addEventListener("click", function () {
        const query = encodeURIComponent(keyword.textContent);
        // Direct method with noreferrer
        const newWindow = window.open('', '_blank');
        if (newWindow) {
          newWindow.opener = null;
          newWindow.location = 'https://www.google.com/search?q=' + query + '&btnI=I';
        }
      });
